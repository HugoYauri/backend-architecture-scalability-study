name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-demos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        demo:
          - src/01-load-balancing-demo/server
          - src/02-cache-aside-demo/app
          - src/03-rate-limiting-demo/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build ${{ matrix.demo }}
        working-directory: ${{ matrix.demo }}
        run: |
          go mod init tmp-ci-check 2>/dev/null || true
          go mod tidy
          go build ./...
