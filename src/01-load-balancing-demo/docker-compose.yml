services:
  server1:
    build: ./server
    environment:
      - INSTANCE_ID=1

  server2:
    build: ./server
    environment:
      - INSTANCE_ID=2

  server3:
    build: ./server
    environment:
      - INSTANCE_ID=3

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - server1
      - server2
      - server3
